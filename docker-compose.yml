services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]

  migrate:
    build: .
    command: python -m alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  init:
    build: .
    command: python init_data.py
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - media_data:/media
    environment:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data: